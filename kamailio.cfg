##### MONITORING ACTIVE CALLS #####
route[MONITORING_ACTIVE_CALLS_START] {

	$http_req(all) = $null;
    $http_req(suspend) = 0;
    $http_req(timeout) = HTTP_API_TIMEOUT;
    $http_req(method) = "POST";
    $http_req(hdr) = "Content-Type: application/json";
	$http_req(authmethod) = 1;
	$http_req(username) = "username";
	$http_req(password) = "password";
        
	jansson_set("string", "call_id", $ci, "$var(http_active_calls_query)");
	jansson_set("string", "calling_number", $fU, "$var(http_active_calls_query)"); 
	jansson_set("string", "destination_number", $tU, "$var(http_active_calls_query)");
	jansson_set("string", "call_status", "start", "$var(http_active_calls_query)");
	
    xlog("L_INFO","API Active Calls REQUEST --- START: $var(http_active_calls_query)\n");
    $http_req(body) = $var(http_active_calls_query);
    http_async_query(HTTP_API_ACTIVE_CALLS_ENDPOINT, "ACTIVE_CALLS_API_RESPONSE");
}

route[MONITORING_ACTIVE_CALLS_END] {
	
	$http_req(all) = $null;
    $http_req(suspend) = 0;
    $http_req(timeout) = HTTP_API_TIMEOUT;
    $http_req(method) = "POST";
    $http_req(hdr) = "Content-Type: application/json";
	$http_req(authmethod) = 1;
	$http_req(username) = "username";
	$http_req(password) = "password";
        
	jansson_set("string", "call_id", $dlg(callid), "$var(http_active_calls_query)");
	jansson_set("string", "calling_number", $dlg_var("calling_number"), "$var(http_active_calls_query)"); 
	jansson_set("string", "destination_number", $dlg_var("called_number"), "$var(http_active_calls_query)");
	jansson_set("string", "call_status", "end", "$var(http_active_calls_query)");
	
    xlog("L_INFO","API Active Calls REQUEST --- END: $var(http_active_calls_query)\n");
    $http_req(body) = $var(http_active_calls_query);
    http_async_query(HTTP_API_ACTIVE_CALLS_ENDPOINT, "ACTIVE_CALLS_API_RESPONSE");
}

route[ACTIVE_CALLS_API_RESPONSE] {
    if ($http_ok && $http_rs == 200) {
        xlog("L_INFO","API Active Calls RESPONSE: $http_rb\n");
        if (!jansson_get("id", $http_rb, "$var(id)")) {
          xlog("L_ERR", "API call not successful!\n");
        }
        return;
    }
    send_reply(500, "API Not Available");
    exit;
}


