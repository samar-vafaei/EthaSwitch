####### Routing Logic ########
request_route {

    if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483","Too Many Hops");
		exit;
	}

    # request with no Username in RURI	
	if ($rU==$null) {    
		sl_send_reply("484","Address Incomplete");
		exit;
	}	

	##### Topology Hiding + RTPEngine --- SIP REQUEST #####
	if (is_method("INVITE") && (!has_totag())) {

		if (has_body("application/sdp")) {
			if(rtpengine_manage()){						
				t_on_reply("2");						
			}
		}	

		route(CREATE_DIALOG);		    
	    route(UPDATE_REQUEST);		
	}

	if(is_method("ACK|BYE")) {
	    route(UPDATE_REQUEST);		
	}
	##### Topology Hiding + RTPEngine --- SIP REQUEST #####
		
	$rd="72.52.124.18";

	##### Topology Hiding --- SIP RESPONSE #####
	t_on_reply("1");
	##### Topology Hiding --- SIP RESPONSE #####

	route(RELAY);
}

##### ROUTE RELAY #####
route[RELAY] {

	if (!t_relay())
	{
    	sl_reply_error();    
	};

	exit;
}

##### Topology Hiding + RTPEngine #####
route[CREATE_DIALOG] {
	#create dialog
	dlg_manage();

	$dlg_var(callid)=$dlg(callid);
	$dlg_var(from_contact)=$dlg(from_contact);
	$dlg_var(to_contact)=$dlg(to_contact);
	$dlg_var(from_cseq)=$dlg(from_cseq);
	$dlg_var(to_cseq)=$dlg(to_cseq);
	$dlg_var(to_domain)=$td;	
	$dlg_var(from_domain)=$fd;	
}

route[UPDATE_REQUEST] {
	#remove all via hdrs different from local domain
	remove_hf_value("via[*]");		

	#remove all record_route hdrs different from local domain
	remove_hf_value("record-route[*]");		

	#remove all route hdrs different from local domain
	remove_hf_value("route[*]");		

	#check TO hdr domain 
	if(!is_myself("$td")){		
		$td=LOCAL_IP;
	}

	#check FROM hdr domain 
	if(!is_myself("$fd")){
		$fd=LOCAL_IP;
	}

	#check call-id hdr domain
	remove_hf("Call-ID");

	$var(x)=$dlg_var(callid);
	$var(p1)=$(var(x){s.select,0,@});
	#$var(p2)=$(var(x){s.select,1,@});
	$var(x)='Call-ID: '+$var(p1)+'@'+LOCAL_IP;

	append_hf("$var(x)\r\n");

	#check contact hdr domain 
	remove_hf("Contact");
	# $var(x)=$ct;
	$var(x)=$dlg_var(from_contact);
	$var(p1)=$(var(x){s.select,0,@});
	$var(p2)=$(var(x){s.select,1,@}{s.select,1,:});
	$var(x)='Contact: '+$var(p1)+'@'+LOCAL_IP+':'+$var(p2);
	append_hf("$var(x)\r\n");
}

onreply_route[1]{
	remove_hf("Call-ID");
	remove_hf("Contact");

	if(is_method("INVITE")){
		if( t_check_status("200")) {
			$var(x)=$ct;
			$var(p1)=$(var(x){s.select,0,:});
			$var(p2)=$(var(x){s.select,1,:});
			$var(x)=$var(p1)+':'+$tU+'@'+$var(p2)+':'+LOCAL_PORT+'>';
			$dlg_var(test) = $var(x);
			$dlg_var(xx) = $var(p2);

            $dlg_var(connect_time) = $TS ;
		} 

        if( t_check_status("180")) {
            $dlg_var(alert_time) = $TS ;
        }

        if( t_check_status("183")) {
            $dlg_var(alert_time) = $TS ;
        }

		$td=$dlg_var(to_domain);
		$fd=$dlg_var(from_domain);	

		append_hf("Call-ID: $dlg_var(callid)\r\n");
		append_hf("Contact: $dlg_var(from_contact)\r\n");
	}

	if(is_method("BYE") && t_check_status("200")) {
        $dlg_var(disconnect_time) = $TS ;

		$td=$sht(a=>$td);
		$fd=$sht(a=>$fd);
        
		append_hf("Call-ID: $sht(a=>$ci)\r\n");
		append_hf("Contact: $sht(a=>$ct)\r\n");
	}
}

onreply_route[2]{

	if(is_method("INVITE")){
		if (t_check_status("200")){
			if (has_body("application/sdp")){

				remove_hf("Call-ID");
				append_hf("Call-ID: $dlg_var(callid)\r\n");

				remove_hf("Contact");
				append_hf("Contact: $dlg_var(from_contact)\r\n");

				$td=$dlg_var(to_domain);
				$fd=$dlg_var(from_domain);	

				rtpengine_manage();	
			}
		}		
	}
}

##### CDR #####
event_route[dialog:start] {	
	# one API to insert a call record into DB and refresh a web page:
	route(INSERT_ACTIVE_CALLS);

	route(WRITE_CDR_START);

	$sht(a=>$ci)=$dlg_var(callid);
	$sht(a=>$ct)=$dlg_var(from_contact);
	$sht(a=>$td)=$dlg_var(to_domain);
	$sht(a=>$fd)=$dlg_var(from_domain);
}

event_route[dialog:end] {
	# one API to delete a call record from DB and refresh a page:
	route(DELETE_ACTIVE_CALLS);

    route(WRITE_CDR_END);
}

event_route[dialog:failed] {
    route(WRITE_CDR_FAILED_CALL);
}

route[WRITE_CDR_START] {

    jansson_set("string", "start_time", $dlg(start_ts), "$avp(json_request)"); 
    jansson_set("string", "alert_time", $dlg_var(alert_time), "$avp(json_request)"); 
    jansson_set("string", "connect_time", $dlg_var(connect_time), "$avp(json_request)"); 
    jansson_set("string", "disconnect_time", $dlg_var(disconnect_time), "$avp(json_request)"); 
    jansson_set("string", "destination_name", $tU, "$avp(json_request)"); 
    jansson_set("obj", "customer", '{"call_id":"$dlg(callid)","name":"RouteInspector","id":"221","epgroup":"0","destination_prefix":"0","rate":"1","signalling_ip":"$si","country_name":"IRAN","destination_name":"Iran - Mobile MTN","ani_number":"$fU","destination_number":"$tU","disconnect_cause":"$rs"}', "$avp(json_request)"); 
    jansson_set("obj", "provider", '{"call_id":"$ci","signalling_ip":"$su","name":"0","id":"0","epgroup":"0","tech_prefix":"0","rate":"1","ani_number":"0","destination_number":"$tU","disconnect_cause":"$rs"}', "$avp(json_request)");

    xlog("L_INFO", "--ETHASWITCH-- cdr: $avp(json_request)\r\n");
    rabbitmq_publish(RABBITMQ_EXCHANGE, "cdr_request","application/json", "$avp(json_request)");
}

