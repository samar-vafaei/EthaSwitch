####### Routing Logic ########
request_route {
	
	if(is_method("INVITE") && (!has_totag())){
		dlg_manage();	

		$dlg_var("setup_time")=$Ts;
		$dlg_var("calling_number")=$fU;
		$dlg_var("called_number")=$tU;
		$dlg_var("customer_signaling_ip")=$fd;       	
		
		if(get_user_group("Request-URI", "$avp(s:setid)")){	

			if(ds_select_routes("$avp(setid)=10;$avp(setid)=11", "ruri")) {

				$var(prefix)=$(xavp(_dsdst_=>attrs){s.select,2,;}{s.select,1,=});
				$var(strip)=$(xavp(_dsdst_=>attrs){s.select,3,;}{s.select,1,=});
				
				$rU=$var(prefix)+$(rU{s.substr,$(var(strip){s.int}),0}); 
				$dlg_var(rU)=$rU;			

				t_on_failure("REROUTE");
				route(RELAY);
			}
		}

		t_on_reply("1");
	}

	if(is_method("ACK|BYE")){	

		if(is_method("BYE")){	
			ds_load_update();
		}

		$rU=$dlg_var(rU); 	
		$rd=$dlg_var(ruri);

		route(RELAY);
	}
}

route[RELAY]{
	if (!t_relay()) {
		sl_reply_error();
	}
	
	exit;
}

event_route[dialog:start] {
	$dlg_var("provider_signaling_ip")=$si;
	$dlg_var("connect_time")=$Ts;

	route(WRITE_CDR_START);        
}

event_route[dialog:end] {
	route(WRITE_CDR_END);        
}

event_route[dialog:failed] {
	route(WRITE_CDR_FAILED_CALL);
}

route[WRITE_CDR_START] {

    jansson_set("string", "date", $timef(%y/%m/%d), "$avp(json_request)"); 
    jansson_set("string", "hour", $time(hour), "$avp(json_request)"); 
    jansson_set("string", "minute", $time(min), "$avp(json_request)"); 
    # jansson_set("string", "state", $dlg(state), "$avp(json_request)");
    jansson_set("string", "calling_number", $fU, "$avp(json_request)"); 
    jansson_set("string", "called_number", $tU, "$avp(json_request)");     
    # jansson_set("string", "start_time", $dlg(start_ts), "$avp(json_request)"); 
    jansson_set("string", "setup_time", $dlg_var("setup_time"), "$avp(json_request)");     
    jansson_set("string", "alert_time", $dlg_var("alert_time"), "$avp(json_request)"); 
    jansson_set("string", "connect_time", $Ts, "$avp(json_request)"); 
    jansson_set("string", "disconnect_time", $null, "$avp(json_request)"); 
    jansson_set("string", "provider_disconnect_cause", $rr, "$avp(json_request)"); 
    jansson_set("string", "customer_signaling_ip", $fd, "$avp(json_request)"); 
    jansson_set("string", "provider_signaling_ip", $dlg_var("provider_signaling_ip"), "$avp(json_request)"); 
    jansson_set("string", "callid", $ci, "$avp(json_request)"); 
       
    xlog("L_INFO", "--ETHASWITCH-- cdr(start): $avp(json_request)\r\n");
    rabbitmq_publish(RABBITMQ_EXCHANGE, "cdr_request","application/json", "$avp(json_request)");
}

