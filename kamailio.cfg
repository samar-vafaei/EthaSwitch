##### NUMBER OF ACTIVE CALLS #####
route[INSERT_ACTIVE_CALLS] {
	$http_req(all) = $null;
    $http_req(suspend) = 0;
    $http_req(timeout) = HTTP_API_TIMEOUT;
    $http_req(method) = "POST";
    $http_req(hdr) = "Content-Type: application/json";
	$http_req(authmethod) = 1;
	$http_req(username) = "username";
	$http_req(password) = "password";
        
	jansson_set("int", "number_of_active_calls", $DLG_count, "$var(http_active_calls_query)");

    xlog("L_INFO","API Active Calls REQUEST --- INSERT: $var(http_active_calls_query)\n");
    $http_req(body) = $var(http_active_calls_query);
    http_async_query(HTTP_API_INSERT_ACTIVE_CALLS_ENDPOINT, "ACTIVE_CALLS_API_RESPONSE");
}

route[DELETE_ACTIVE_CALLS] {
	$http_req(all) = $null;
    $http_req(suspend) = 0;
    $http_req(timeout) = HTTP_API_TIMEOUT;
    $http_req(method) = "POST";
    $http_req(hdr) = "Content-Type: application/json";
	$http_req(authmethod) = 1;
	$http_req(username) = "username";
	$http_req(password) = "password";
        
	jansson_set("int", "number_of_active_calls", $DLG_count, "$var(http_active_calls_query)");

    xlog("L_INFO","API Active Calls REQUEST --- DELETE: $var(http_active_calls_query)\n");
    $http_req(body) = $var(http_active_calls_query);
    http_async_query(HTTP_API_DELETE_ACTIVE_CALLS_ENDPOINT, "ACTIVE_CALLS_API_RESPONSE");
}

route[ACTIVE_CALLS_API_RESPONSE] {
    if ($http_ok && $http_rs == 200) {
        xlog("L_INFO","API Active Calls RESPONSE: $http_rb\n");
        if (!jansson_get("id", $http_rb, "$var(id)")) {
          xlog("L_ERR", "API call not successful!\n");
        }
        return;
    }
    send_reply(500, "API Not Available");
    exit;
}


