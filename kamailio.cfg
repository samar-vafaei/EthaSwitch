#!KAMAILIO

# Define local variables
#!define LOCAL_IP "172.18.0.2" 
#!define LOCAL_PORT 5060

####### Global Parameters #########
listen=udp:LOCAL_IP:LOCAL_PORT

### LOG Levels: 3=DBG, 2=INFO, 1=NOTICE, 0=WARN, -1=ERR
debug=2
log_stderror=no
 
memdbg=5
memlog=5
 
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "
 
children=4
auto_aliases=no

shm_mem_size=800
server_header="Server: EthaSwitch"
user_agent_header="User-Agent: EthaLab"

####### Modules Section ########
/* set paths to location of modules */
#mpath="/usr/local/lib/kamailio/modules/"

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "debugger.so"
loadmodule "textops.so"
loadmodule "textopsx.so"
loadmodule "ipops.so"
loadmodule "avp.so"
loadmodule "dialog.so"

# loadmodule "db_mysql.so"
loadmodule "db_postgres.so"
loadmodule "keepalive.so"

# mtree module
loadmodule "mtree.so"
modparam("mtree", "db_url","postgres://kamailio:kamailiorw@172.18.0.8/kamailio")
modparam("mtree", "db_table", "mtrees")
modparam("mtree", "pv_value", "$avp(lcr_mt_values)")

# LCR module 
loadmodule "lcr.so"
modparam("lcr", "db_url","postgres://kamailio:kamailiorw@172.18.0.8/kamailio")
modparam("lcr", "gw_uri_avp", "$avp(lcr_gwuri)")
modparam("lcr", "mt_pv_values", "$avp(lcr_mt_values)")
modparam("lcr", "defunct_gw_avp", "$avp(lcr_defunct_gw)")
modparam("lcr", "ruri_user_avp", "$avp(lcr_ruri_user)")
modparam("lcr", "mtree", "caller_tree")
modparam("lcr", "defunct_capability", 1)
modparam("lcr", "lcr_id_avp", "$avp(lcr_id)")
modparam("lcr", "lcr_rule_hash_size", 1024)
modparam("lcr", "lcr_gw_count", 1024)
modparam("lcr", "priority_ordering", 1)
modparam("lcr", "ping_interval", 15)

# DISPATCHER module
loadmodule "dispatcher.so"
modparam("dispatcher", "xavp_dst", "_dsdst_")
 
# auto-discard branches from previous serial forking leg
modparam("tm", "failure_reply_mode", 3)
# default retransmission timeout: 30sec
modparam("tm", "fr_timer", 30000)
# default invite retransmission timeout after 1xx: 120sec
modparam("tm", "fr_inv_timer", 120000)
modparam("tm", "auto_inv_100", 1)
modparam("tm", "reparse_invite", 1) 

# ----- rr params -----
# set next param to 1 to add value to ;lr param (helps with some UAs)
modparam("rr", "enable_full_lr", 0)
# do not append from tag to the RR (no need for this script)
modparam("rr", "append_fromtag", 0)

# ----- debugger params -----
modparam("debugger", "cfgtrace", 0)
modparam("debugger", "log_level_name", "exec")


####### Routing Logic ########
request_route {

	# populate re_grp table: reg_exp column ---> ^761[0-9]{1,12}@23\.19\.63\.83$ (regular expression), group_id column ---> grp_id
	if(is_method("INVITE")){
		# LCR instance
		$var(lcr_id) = from_any_gw($si,3);
		# if(load_gws($var(lcr_id), $rU, $var(caller_uri))){
		if(load_gws($var(lcr_id))){
			# load attributes of matching gateways: $avp(lcr_gwuri)						
			$xavp(_dsdst_=>attrs)=$avp(lcr_gwuri);						
		}

		# dispatcher needed
		ds_set_domain();
		
		dlg_manage();
		
		t_on_failure("REROUTE");

		# t_on_reply("fail");
	
		#record_route();

		route(RELAY);
	}

	if(is_method("ACK|BYE")){		
		$rd=$dlg_var(ruri);
		route(RELAY);
	}
}

route[RELAY]{
	t_relay();
	exit;
}

failure_route["REROUTE"]{
	if(t_check_status("408|5[0-9][0-9]")){
		if(ds_next_domain()){
			t_on_failure("REROUTE");
			route(RELAY);
		}		
	}
}

onreply_route[fail]{	

	if(!t_check_status("(180)|(183)|(200)")){
		t_on_failure("serial");
		exit;

	}
}

event_route[dialog:start]{	
	$dlg_var(ruri)=$si;
}

