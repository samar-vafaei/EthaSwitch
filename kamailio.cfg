#!KAMAILIO

# Define local variables
#
#!define LOCAL_IP "172.18.0.2" 
#!define LOCAL_PORT 5060

####### Global Parameters #########

listen=udp:LOCAL_IP:LOCAL_PORT

### LOG Levels: 3=DBG, 2=INFO, 1=NOTICE, 0=WARN, -1=ERR
debug=2
log_stderror=no
 
memdbg=5
memlog=5
 
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "
 
children=4
auto_aliases=no
 
server_header="Server: ETHA Switch"
user_agent_header="User-Agent: ETHALab"
shm_mem_size=800
#pkg_mem_size=64

####### Modules Section ########
 
/* set paths to location of modules */
#mpath="/usr/local/lib/kamailio/modules/"

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "debugger.so"
loadmodule "textops.so"
loadmodule "textopsx.so"
loadmodule "ipops.so"
loadmodule "avp.so"
loadmodule "jsonrpcs.so"
loadmodule "json.so"
 
# auto-discard branches from previous serial forking leg
modparam("tm", "failure_reply_mode", 3)
# default retransmission timeout: 30sec
modparam("tm", "fr_timer", 30000)
# default invite retransmission timeout after 1xx: 120sec
modparam("tm", "fr_inv_timer", 120000)
modparam("tm", "auto_inv_100", 1)
modparam("tm", "reparse_invite", 1) 

# ----- rr params -----
# set next param to 1 to add value to ;lr param (helps with some UAs)
modparam("rr", "enable_full_lr", 0)
# do not append from tag to the RR (no need for this script)
modparam("rr", "append_fromtag", 0)

# ----- debugger params -----
modparam("debugger", "cfgtrace", 0)
modparam("debugger", "log_level_name", "exec")


####### Routing Logic ########
request_route {
	
	$avp(json_request) = "{\"b_number\":\""+$rU+"\", \"ip_address\":\""+$si+"\", \"port\":\""+$sp+"\", \"a_number\":\""+$fU+"\"}";
	rabbitmq_publish_consume(RABBITMQ_EXCHANGE, RABBITMQ_ROUTING_KEY, "application/json", "$avp(json_request)", "$avp(rabbit_reply)");
	jansson_get("routing_table", "$avp(rabbit_reply)", "$avp(json_reply)");

	$var(i) = 0 ;
	jansson_array_size("routes", "$avp(json_reply)", "$avp(route_count)") ;
	if ( $avp(route_count) == 0){
		send_reply("404", "Not found");
		exit;
	}

	resetflag(0);
	while(($var(i) < $avp(route_count) && (!isflagset(0)) {

		jansson_get("routes[$var(i)]", $avp(json_reply), "$avp(route)");
		jansson_get("tech_prefix", "$avp(route)", "$avp(destination_prefix)");

		$var(j) = 0; 
		jansson_array_size("ip_addresses", "$avp(route)", "$avp(ip_counts)");

		while($var(j) < $avp(ip_counts)){

		    jansson_get("ip_addresses[$var(j)].ip_address", "$avp(route)", "$avp(ip_address)");
		    jansson_get("ip_addresses[$var(j)].port", "$avp(route)", "$avp(port)");

		    if(!$avp(port)) {
			$avp(port)="5060";
		    }

		    if($avp(ip_address) != $null) {	

				$var(ruri)=$avp(ip_address)+':'+$avp(port);
				rewritehostporttrans($var(ruri));

				if(!t_relay()){
					#get next gateway from the list
					continue;
				}

				setflag(0);
				break;
					
	           }
            
		   $var(j) = $var(j) + 1;
	        }

		$var(i) = $var(i) + 1;
	}
	
	exit;
}


