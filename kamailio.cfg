failure_route["REROUTE"]{
	if(t_check_status("3[0-9][0-9]|4[0-9][0-9]|5[0-9][0-9]")){
		if(ds_next_domain()){
			t_on_failure("REROUTE");
			route(RELAY);
		}		
	}
}

event_route[dialog:start]{	
	$dlg_var(ruri)=$si;
}

onreply_route[1]{
    
	if(is_method("INVITE"))
	{
		if(t_check_status("(180)|(183)")) {
			$dlg_var("alert_time")=$Ts;
        }

		if(t_check_status("2[0-9][0-9]"))
			ds_load_update();

		if(t_check_status("3[0-9][0-9]|4[0-9][0-9]|5[0-9][0-9]"))
			ds_load_unset();
    }
}
