####### Global Parameters #########

listen=udp:LOCAL_IP:LOCAL_PORT

### LOG Levels: 3=DBG, 2=INFO, 1=NOTICE, 0=WARN, -1=ERR
debug=2
log_stderror=no
 
memdbg=5
memlog=5
 
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "
 
children=4
auto_aliases=no
 
server_header="Server: EthaSwitch"
user_agent_header="User-Agent: EthaLabs"
shm_mem_size=800
#pkg_mem_size=64

####### Modules Section ########
 
/* set paths to location of modules */
#mpath="/usr/local/lib/kamailio/modules/"

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "debugger.so"
loadmodule "textops.so"
loadmodule "textopsx.so"
loadmodule "ipops.so"
loadmodule "avp.so"
# loadmodule "jsonrpcs.so"
loadmodule "dialog.so"
loadmodule "jansson.so"

# loadmodule "rabbitmq.so"
# modparam("rabbitmq", "url", RABBITMQ_URL)
# modparam("rabbitmq", "direct_reply_to", 1)
# modparam("rabbitmq", "timeout_usec", 1000)
 
# auto-discard branches from previous serial forking leg
modparam("tm", "failure_reply_mode", 3)
# default retransmission timeout: 30sec
modparam("tm", "fr_timer", 30000)
# default invite retransmission timeout after 1xx: 120sec
modparam("tm", "fr_inv_timer", 120000)
modparam("tm", "auto_inv_100", 1)
modparam("tm", "reparse_invite", 1) 

# ----- rr params -----
# set next param to 1 to add value to ;lr param (helps with some UAs)
modparam("rr", "enable_full_lr", 0)
# do not append from tag to the RR (no need for this script)
modparam("rr", "append_fromtag", 0)

# ----- debugger params -----
modparam("debugger", "cfgtrace", 0)
modparam("debugger", "log_level_name", "exec")


####### Routing Logic ########
request_route {        

	if (is_method("INVITE") && (!has_totag())) {
		dlg_manage();
                $dlg_var("setup_time")=$Ts;
                t_on_reply("1");
	}

        $rd="172.18.0.4";

        route(RELAY);	
}

##### ROUTE RELAY #####
route[RELAY] {
        if (!t_relay()) {
                sl_reply_error();
        }

        exit;
}

##### CDR #####
event_route[dialog:start] {
        route(WRITE_CDR_START);        
}

event_route[dialog:end] {
        route(WRITE_CDR_END);        
}

event_route[dialog:failed] {
        route(WRITE_CDR_FAILED_CALL);
}

route[WRITE_CDR_START] {

    jansson_set("string", "date", $timef(%y/%m/%d), "$avp(json_request)"); 
    jansson_set("string", "hour", $time(hour), "$avp(json_request)"); 
    jansson_set("string", "minute", $time(min), "$avp(json_request)"); 
    jansson_set("string", "calling_number", $fU, "$avp(json_request)"); 
    jansson_set("string", "called_number", $tU, "$avp(json_request)"); 
    jansson_set("string", "setup_time", $dlg_var("setup_time"), "$avp(json_request)");     
    jansson_set("string", "alert_time", $dlg_var("alert_time"), "$avp(json_request)"); 
    jansson_set("string", "connect_time", $Ts, "$avp(json_request)"); 
    jansson_set("string", "disconnect_time", $null, "$avp(json_request)"); 
    jansson_set("string", "provider_disconnect_cause", $rr, "$avp(json_request)"); 
    jansson_set("string", "customer_signaling_ip", $fd, "$avp(json_request)"); 
    jansson_set("string", "provider_signaling_ip", $rd, "$avp(json_request)"); 
    jansson_set("string", "callid", $ci, "$avp(json_request)"); 
       
    xlog("L_INFO", "--ETHASWITCH-- cdr(start): $avp(json_request)\r\n");
#     rabbitmq_publish(RABBITMQ_EXCHANGE, "cdr_request","application/json", "$avp(json_request)");
}

route[WRITE_CDR_END] {

    jansson_set("string", "date", $timef(%y/%m/%d), "$avp(json_request)"); 
    jansson_set("string", "hour", $time(hour), "$avp(json_request)"); 
    jansson_set("string", "minute", $time(min), "$avp(json_request)"); 
    jansson_set("string", "calling_number", $fU, "$avp(json_request)"); 
    jansson_set("string", "called_number", $tU, "$avp(json_request)"); 
    jansson_set("string", "setup_time", $dlg_var("setup_time"), "$avp(json_request)");     
    jansson_set("string", "alert_time", $dlg_var("alert_time"), "$avp(json_request)"); 
    jansson_set("string", "connect_time", $null, "$avp(json_request)"); 
    jansson_set("string", "disconnect_time", $Ts, "$avp(json_request)"); 
    jansson_set("string", "provider_disconnect_cause", $rr, "$avp(json_request)"); 
    jansson_set("string", "customer_signaling_ip", $fd, "$avp(json_request)"); 
    jansson_set("string", "provider_signaling_ip", $rd, "$avp(json_request)"); 
    jansson_set("string", "callid", $ci, "$avp(json_request)"); 
    
    xlog("L_INFO", "--ETHASWITCH-- cdr(end): $avp(json_request)\r\n");
#     rabbitmq_publish(RABBITMQ_EXCHANGE, "cdr_request","application/json", "$avp(json_request)");
}

route[WRITE_CDR_FAILED_CALL] {
        
    # missed calls    	
    jansson_set("string", "date", $timef(%y/%m/%d), "$avp(json_request)"); 
    jansson_set("string", "hour", $time(hour), "$avp(json_request)"); 
    jansson_set("string", "minute", $time(min), "$avp(json_request)"); 
    jansson_set("string", "calling_number", $fU, "$avp(json_request)"); 
    jansson_set("string", "called_number", $tU, "$avp(json_request)"); 
    jansson_set("string", "setup_time", $dlg_var("setup_time"), "$avp(json_request)");     
    jansson_set("string", "alert_time", $dlg_var("alert_time"), "$avp(json_request)"); 
    jansson_set("string", "connect_time", $null, "$avp(json_request)"); 
    jansson_set("string", "disconnect_time", $Ts, "$avp(json_request)"); 
    jansson_set("string", "provider_disconnect_cause", $rr, "$avp(json_request)"); 
    jansson_set("string", "customer_signaling_ip", $fd, "$avp(json_request)"); 
    jansson_set("string", "provider_signaling_ip", $rd, "$avp(json_request)"); 
    jansson_set("string", "callid", $ci, "$avp(json_request)"); 
    
    xlog("L_INFO", "--ETHASWITCH-- cdr(failed): $avp(json_request)\r\n");
#     rabbitmq_publish(RABBITMQ_EXCHANGE, "cdr_request","application/json", "$avp(json_request)");
}

onreply_route[1]{
        if( t_check_status("(180)|(183)")) {
                $dlg_var("alert_time")=$Ts;
        }
}

